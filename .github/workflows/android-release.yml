name: Build and publish Haven APK
on:
  push:
    branches: [main]
    paths: ["release-request.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haven-apk-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed source request
        id: request
        run: |
          node -e 'const fs=require("node:fs"),r=JSON.parse(fs.readFileSync("release-request.json"));if(r.schemaVersion!==1||r.repository!=="SeefatHimel/haven"||!/^[a-f0-9]{40}$/.test(r.commit))throw Error("Invalid release request");fs.appendFileSync(process.env.GITHUB_OUTPUT,"commit="+r.commit+"\n")'
      - name: Skip a source commit already published
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          gh api repos/SeefatHimel/haven-releases/releases?per_page=100 > "$RUNNER_TEMP/releases.json"
          node -e 'const fs=require("node:fs"),rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/releases.json")),exists=rows.some(r=>!r.draft&&r.body?.includes("Source commit: "+process.env.SOURCE_COMMIT));fs.appendFileSync(process.env.GITHUB_OUTPUT,"exists="+exists+"\n")'
      - uses: actions/checkout@v4
        if: steps.previous.outputs.exists != 'true'
        with:
          repository: SeefatHimel/haven
          ref: ${{ steps.request.outputs.commit }}
          fetch-depth: 0
          path: source
          ssh-key: ${{ secrets.HAVEN_SOURCE_READ_KEY }}
          persist-credentials: false
      - name: Require the requested commit to belong to main
        if: steps.previous.outputs.exists != 'true'
        working-directory: source
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Test release publication and recovery
        if: steps.previous.outputs.exists != 'true'
        working-directory: source
        run: node --test tests/releases.mjs
      - uses: actions/setup-java@v4
        if: steps.previous.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        if: steps.previous.outputs.exists != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore the existing preview signing identity
        if: steps.previous.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HAVEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/haven-preview.keystore"
          chmod 600 "$RUNNER_TEMP/haven-preview.keystore"
          echo "HAVEN_ANDROID_KEYSTORE=$RUNNER_TEMP/haven-preview.keystore" >> "$GITHUB_ENV"
          echo "HAVEN_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          node -e 'const fs=require("node:fs"),r=JSON.parse(fs.readFileSync("source/android/release.json"));if(!/^\d+\.\d+\.\d+-preview$/.test(r.versionName))throw Error("Invalid preview version");fs.appendFileSync(process.env.GITHUB_ENV,"HAVEN_VERSION_NAME="+r.versionName+"\n")'
      - name: Test and assemble Android preview
        if: steps.previous.outputs.exists != 'true'
        working-directory: source/android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify and publish the exact APK
        if: steps.previous.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.request.outputs.commit }}
        run: node source/scripts/release/publish.mjs
      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/haven-preview.keystore"
